<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeLearn · 代码库学习</title>
  <link rel="stylesheet" href="/static/vendor/github-dark.min.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="app">
    <!-- 顶栏 -->
    <header class="topbar">
      <div class="brand">
        <span class="logo">◧</span> CodeLearn
        <span class="repo-name" id="repoName">—</span>
      </div>
      <div class="top-actions">
        <span class="preload-badge hidden" id="preloadBadge">预加载中</span>
        <button id="btnOpenWorkspace" class="btn" title="打开任意文件夹作为工作区">📂 打开工作区</button>
        <span class="health" id="healthDot" title="检查中…">●</span>
        <label class="model-pick" title="项目分析用的模型（路线图/注解/探索），要求稳定">
          <span class="model-pick-label">分析</span>
          <select id="analysisModelSelect"></select>
        </label>
        <label class="model-pick" title="右侧对话用的模型，可随时切换测试">
          <span class="model-pick-label">对话</span>
          <select id="chatModelSelect"></select>
        </label>
        <select id="langSelect" title="讲解语言">
          <option value="zh">中文讲解</option>
          <option value="en">English</option>
        </select>
      </div>
    </header>

    <div class="main">
      <!-- 侧边栏 -->
      <aside class="sidebar">
        <div class="tabs">
          <button class="tab active" data-tab="roadmap">学习路线</button>
          <button class="tab" data-tab="tree">文件树</button>
        </div>
        <div class="tab-panel" id="panel-roadmap">
          <div class="panel-actions">
            <button id="btnRoadmap" class="btn">生成/加载路线图</button>
            <button id="btnRoadmapEdit" class="btn ghost hidden" title="微调教案">编辑</button>
            <button id="btnRoadmapSave" class="btn primary hidden" title="保存微调（不重新生成）">保存微调</button>
            <button id="btnRoadmapRegen" class="btn ghost" title="重新生成">↻</button>
          </div>
          <div id="roadmapBody" class="roadmap-body">
            <p class="hint">点击上方按钮，让 AI 分析整个项目并生成学习路线。</p>
          </div>
        </div>
        <div class="tab-panel hidden" id="panel-tree">
          <div id="treeBody" class="tree-body"><p class="hint">加载中…</p></div>
        </div>
      </aside>

      <!-- 阅读区 -->
      <section class="reader">
        <div class="reader-header" id="readerHeader">
          <p class="welcome">
            欢迎使用 <b>CodeLearn</b>。<br />
            左侧选择「学习路线」按 AI 编排的顺序学习，或用「文件树」自由浏览。<br />
            打开文件后可一键生成逐块讲解，打开文件夹可查看模块导读。<br />
            阅读时可点注释旁的「详解」深入了解某段代码，或在右侧对话栏向 AI 提问。
          </p>
        </div>
        <div class="reader-body" id="readerBody"></div>
        <!-- 划选代码后浮现的引用提问按钮 -->
        <button id="askSelectionBtn" class="ask-selection hidden">引用提问 ↦</button>
      </section>

      <!-- 右侧对话/详解分栏（可开关滑出） -->
      <aside class="chat-panel collapsed" id="chatPanel">
        <div class="chat-head">
          <span class="chat-title" id="chatTitle">AI 助手 · 会话</span>
          <div class="chat-head-actions">
            <button id="chatNewBtn" class="mini-btn" title="新建自由提问会话">＋ 新会话</button>
            <button id="chatClearBtn" class="mini-btn" title="删除全部会话">清空</button>
            <button id="chatCloseBtn" class="icon-btn" title="收起">✕</button>
          </div>
        </div>
        <!-- 会话卡片列表：每个详解/引用/自由提问都是独立、可折叠、可删除的一张卡 -->
        <div id="chatSessions" class="chat-sessions"></div>
        <!-- 底部输入：发往“当前活动会话” -->
        <div class="chat-input-wrap">
          <div id="chatActiveHint" class="chat-active-hint hidden"></div>
          <div class="chat-input-row">
            <textarea id="chatInput" class="chat-input" rows="1"
              placeholder="问点什么…（普通问题直接问；想针对某段代码，先在左侧划选）"></textarea>
            <button id="chatSendBtn" class="btn primary" title="发送">发送</button>
          </div>
        </div>
      </aside>
    </div>

    <!-- 收起态下用于重新打开对话栏的悬浮按钮 -->
    <button id="chatFab" class="chat-fab" title="打开 AI 助手">💬 AI</button>

    <!-- 工作区选择器：浏览宿主文件系统 / 粘贴绝对路径 / 最近打开 -->
    <div id="workspaceModal" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-head">
          <span class="modal-title">打开工作区</span>
          <button id="wsCloseBtn" class="icon-btn" title="关闭">✕</button>
        </div>
        <div class="modal-body">
          <p class="ws-hint">选择任意代码文件夹作为学习目标。可浏览下方目录、粘贴绝对路径，或从最近打开中选择。</p>

          <div class="ws-paste-row">
            <input id="wsPathInput" class="ws-input" type="text"
              placeholder="粘贴绝对路径，如 /Users/you/code/myrepo" spellcheck="false" />
            <button id="wsPasteOpen" class="btn primary">打开</button>
          </div>
          <div id="wsError" class="ws-error hidden"></div>

          <div class="ws-browser">
            <div class="ws-cwd-row">
              <button id="wsUpBtn" class="btn ghost" title="上级目录">⬆ 上级</button>
              <span id="wsCwd" class="ws-cwd">—</span>
              <button id="wsOpenHere" class="btn" title="把当前目录作为工作区">打开此处</button>
            </div>
            <div id="wsDirList" class="ws-dir-list"><p class="hint">加载中…</p></div>
          </div>

          <div class="ws-recents">
            <div class="ws-recents-title">最近打开</div>
            <div id="wsRecents" class="ws-recents-list"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/vendor/highlight.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
